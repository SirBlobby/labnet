services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 81:81
      - 25570:25570
      - 19132:19132/udp
      - 25572:25572
      - 19133:19133/udp
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
