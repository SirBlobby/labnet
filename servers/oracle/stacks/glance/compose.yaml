services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - 8084:8080
    environment:
      TZ: America/New_York
    volumes:
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
