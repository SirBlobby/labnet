services:
  permissions:
    image: alpine:3.22
    container_name: rustfs-permissions
    restart: "no"
    command: chown -R 10001:10001 /data
    volumes:
      - ./data:/data
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: rustfs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKETS: ${RUSTFS_BUCKETS:-}
    ports:
      - ${RUSTFS_BIND_ADDRESS}:9000:9000
      - ${RUSTFS_BIND_ADDRESS}:9001:9001
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
